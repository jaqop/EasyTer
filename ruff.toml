# Pinned in requirements-dev.txt and constraints-dev.txt.
required-version = "0.17.2"

# Source still runs on 3.10; the release and CI interpreters are 3.14.
target-version = "py310"

extend-exclude = ["build", "dist"]

# CI runs two passes and does not narrow the default rule set here:
#   ruff check --select F,E9 .                          blocking (syntax, pyflakes)
#   ruff check --exit-zero --output-format=github .     full report, annotations only
