name: Build EasyTer.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PySide6-Essentials "pywinpty>=3.0.5" pyte wcwidth pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller EasyTer.spec --noconfirm

      - name: Smoke-check the exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist\EasyTer\EasyTer.exe)) { throw "dist\EasyTer\EasyTer.exe was not produced" }
          $size = (Get-ChildItem dist\EasyTer -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("dist\EasyTer built: {0:N1} MB unpacked" -f $size)

      # onedir build: ship the whole folder as one zip (users extract once and
      # run EasyTer.exe - no per-launch self-extraction like the old onefile)
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path dist\EasyTer -DestinationPath dist\EasyTer-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyTer-windows
          path: dist/EasyTer-windows.zip

      - name: Attach zip to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyTer-windows.zip
          generate_release_notes: true
