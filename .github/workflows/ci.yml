name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # pytest-qt and the dev Qt tests have no display on the runner
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: pytest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # release.yml builds with 3.14; requirements.txt recommends 3.13 or 3.14
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  lint:
    name: ruff
    runs-on: windows-latest
    # Non-blocking while the existing tree is not yet ruff-clean.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: python -m ruff check .
