name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # setup-python cache: pip saves through the Actions cache API
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pytest-qt and the dev Qt tests have no display on the runner
  QT_QPA_PLATFORM: offscreen
  # Minimum passed-test count. Raise this in the same PR that adds tests.
  TEST_FLOOR: 392

jobs:
  test:
    name: pytest
    runs-on: windows-latest
    # ReaderResilienceTest spawns a real cmd.exe through ConPTY
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # release.yml builds with 3.14; requirements.txt recommends 3.13 or 3.14
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --junitxml=junit.xml

      - name: Enforce test floor
        shell: pwsh
        run: |
          $floor = [int]$env:TEST_FLOOR
          [xml]$doc = Get-Content -Raw -Path junit.xml
          if ($doc.testsuites) {
            $suites = @($doc.testsuites.testsuite)
          } elseif ($doc.testsuite) {
            $suites = @($doc.testsuite)
          } else {
            throw "junit.xml has no testsuite element"
          }
          $tests = 0
          $failures = 0
          $errors = 0
          $skipped = 0
          foreach ($suite in $suites) {
            if ($null -eq $suite) { continue }
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $passed = $tests - $failures - $errors - $skipped
          Write-Host "passed=$passed skipped=$skipped failures=$failures errors=$errors floor=$floor"
          if ($skipped -gt 0) {
            throw "skipped=$skipped; a skipIf on import failure must not hide tests"
          }
          if ($passed -lt $floor) {
            throw "passed=$passed is below TEST_FLOOR=$floor; raise TEST_FLOOR when adding tests"
          }

  lint:
    name: ruff
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-dev.txt

      - name: Install ruff
        run: python -m pip install ruff==0.17.2

      - name: Blocking pyflakes and syntax
        run: python -m ruff check --select F,E9 .

      - name: Full ruff report
        run: python -m ruff check --exit-zero --output-format=github .
